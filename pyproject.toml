[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rayn-strategy"
version = "0.1.0"
description = "Offline crypto strategy research scaffold with bounded-grid and momentum backtests."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tools/ and the root runner scripts are imported by tests but are not part of the package
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# these scripts put the repo root on sys.path to import sibling tools/runners
"tools/{walk_forward_grid,optimize_90d_grid,probation_grid,momentum_paper_backtest,plot_multicycle}.py" = ["E402"]
