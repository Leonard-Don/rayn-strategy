# The OPTIMIZED answer: a trend/momentum strategy — the mirror image of Rayn.
# Rayn: 98% win rate, 1% take-profit, NO stop, martingale, blows up on a correlated crash.
# This: ~35% win rate, BIG winners (W/L ~3.3), hard ATR stop + trailing stop (cut losses,
#       let winners run), risk-based sizing, low leverage, stands aside when BTC is weak.
# 2024-2025: +77% / 17.8% max DD; out-of-sample 2025 incl. 10-10: +17.1%; survives the crash.
# Research only, not investment advice. [strategy]/[grid] are inert filler (MomentumEngine
# uses [momentum]); kept so load_config() validates.

[portfolio]
initial_equity = 2000.0
quote_asset = "USDT"
taker_fee_bps = 5.0
slippage_bps = 3.0

[risk]
leverage = 5.0
risk_per_trade_pct = 0.0075        # used by [momentum]; this field kept for load_config validation
max_position_notional_pct = 0.50
max_total_notional_pct = 1.00      # survival envelope: N/L = 1.0/5 = 0.20 -> full liquidation <= 20%
max_used_margin_pct = 0.95
max_open_positions = 4
max_daily_loss_pct = 0.99
max_account_drawdown_pct = 0.20    # backstop halt at 20% (the strategy's own stops keep DD ~18%)
allow_scale_in = false
max_consecutive_losses = 0
loss_cooldown_bars = 0

[circuit_breaker]
benchmark_symbol = "BTCUSDT"
benchmark_drop_lookback_bars = 4
benchmark_drop_pct = 0.99
pause_bars = 0
close_positions_on_trigger = false

[momentum]
trend_ma_bars = 200
breakout_bars = 168                # 7-day Donchian breakout entry
momentum_bars = 168
min_momentum_pct = 0.0
max_entry_rsi = 85.0
atr_bars = 48
stop_atr_mult = 4.0                # initial hard stop = 4 x ATR below entry
trail_atr_mult = 7.0               # ratcheting trailing stop = 7 x ATR below the high-water close
risk_per_trade_pct = 0.0075        # risk ~0.75% of equity per trade at the stop
max_hold_bars = 4320
regime_ma_bars = 200               # long when BTC > 200h MA; (short when below, if allow_short)
regime_band_pct = 0.0
allow_short = false                # long-only is the better risk-adjusted version (see report Part 4);
                                   # set true for the optional "profit in bears too" mode (worse overall)

# inert filler so load_config() succeeds (unused by MomentumEngine)
[strategy]
timeframe = "1h"
trend_ma_bars = 200
breakout_lookback_bars = 48
breakout_buffer_pct = 0.003
panic_lookback_bars = 72
panic_drop_pct = 0.08
panic_rsi_bars = 14
panic_rsi_max = 34.0
rebound_confirm_pct = 0.002
take_profit_pct = 0.01
stop_loss_pct = 0.018
max_hold_bars = 2160

[grid]
max_rescue_layers = 0
layer_step_pct = 0.01
layer_multiplier = 1.0
take_profit_pct = 0.01
hard_stop_pct = 0.10
max_symbol_notional_pct = 0.5
max_total_notional_pct = 1.0
