# Momentum mirror - small-notional, low-leverage simulated profile.
# Derived from config.rayn-momentum.toml with conservative sizing:
#   - small equity, leverage 3x (was 5x), 3 concurrent positions (was 4)
#   - account-level 20% halt ACTIVE (flatten + stop), long-only
# Used by tools/momentum_paper.py to produce simulated intents only.
# Research only, not investment advice.

[portfolio]
initial_equity = 500.0
quote_asset = "USDT"
taker_fee_bps = 5.0
slippage_bps = 5.0                 # paper assumes WORSE slippage than backtest (breakout entries fill poorly)

[risk]
leverage = 3.0                     # low: liquidation ~33% away, the hard stop (4xATR) fires first
risk_per_trade_pct = 0.0075
max_position_notional_pct = 0.40
max_total_notional_pct = 0.90      # N/L = 0.90/3 = 0.30 cap; the 20% halt binds first
max_used_margin_pct = 0.90
max_open_positions = 3
max_daily_loss_pct = 0.99
max_account_drawdown_pct = 0.20    # ACTIVE backstop: flatten + stop at 20% account drawdown
allow_scale_in = false
max_consecutive_losses = 0
loss_cooldown_bars = 0

[circuit_breaker]
benchmark_symbol = "BTCUSDT"
benchmark_drop_lookback_bars = 4
benchmark_drop_pct = 0.99
pause_bars = 0
close_positions_on_trigger = false

[momentum]
trend_ma_bars = 200
breakout_bars = 168
momentum_bars = 168
min_momentum_pct = 0.0
max_entry_rsi = 85.0
atr_bars = 48
stop_atr_mult = 4.0
trail_atr_mult = 7.0
risk_per_trade_pct = 0.0075
max_hold_bars = 4320
regime_ma_bars = 200
regime_band_pct = 0.0
allow_short = false

# inert filler so load_config() succeeds (unused by MomentumEngine / paper)
[strategy]
timeframe = "1h"
trend_ma_bars = 200
breakout_lookback_bars = 48
breakout_buffer_pct = 0.003
panic_lookback_bars = 72
panic_drop_pct = 0.08
panic_rsi_bars = 14
panic_rsi_max = 34.0
rebound_confirm_pct = 0.002
take_profit_pct = 0.01
stop_loss_pct = 0.018
max_hold_bars = 2160

[grid]
max_rescue_layers = 0
layer_step_pct = 0.01
layer_multiplier = 1.0
take_profit_pct = 0.01
hard_stop_pct = 0.10
max_symbol_notional_pct = 0.5
max_total_notional_pct = 1.0
