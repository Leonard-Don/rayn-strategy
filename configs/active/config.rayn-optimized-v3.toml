# Rayn Optimized V3 - volume-confirmed entries, multi-regime, depth-expanded grid.
# Derived from the bounded-grid research profile with:
#   1. Volume confirmation for breakouts and rebounds
#   2. Multi-dimensional regime detection
#   3. Layer step expansion (deeper layers = wider spacing)
#   4. Removed data-mined blocked hours
#   5. More conservative breakout/rebound thresholds

[portfolio]
